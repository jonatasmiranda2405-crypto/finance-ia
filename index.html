<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Finance IA — Controle Financeiro</title>
<meta name="description" content="Controle de renda e finanças pessoais com receitas, despesas, orçamentos, metas, gráficos e análise por IA.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.4/chart.umd.min.js"></script>
</head>
<body>

<div id="toast-wrap"></div>

<!-- ================= AUTH ================= -->
<div id="auth-screen"><div class="auth-box" id="auth-box">
  <div class="brand"><div class="brand-mark">F</div><div class="brand-name">Finance IA</div></div>
  <div id="auth-content"></div>
</div></div>

<!-- ================= APP ================= -->
<div id="app-shell">
  <div id="overlay-bg" class="overlay-bg hidden" onclick="closeSidebar()"></div>
  <aside class="sidebar" id="sidebar"></aside>
  <div class="main">
    <div class="topbar">
      <div style="display:flex;align-items:center;gap:12px;">
        <button class="mobile-menu-btn" onclick="openSidebar()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
        </button>
        <div class="page-title" id="page-title">Dashboard</div>
      </div>
      <div class="topbar-actions">
        <button class="icon-btn" onclick="toggleNotifPanel()" id="notif-btn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8a6 6 0 10-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 01-3.4 0"/></svg>
          <span id="notif-dot" class="badge-dot hidden"></span>
        </button>
      </div>
    </div>
    <div class="page" id="page-content"></div>
  </div>
</div>

<div id="notif-panel-slot"></div>
<div id="modal-slot"></div>

<script src="app.js"></script>
</body>
</html>
